# bloub — original palette (styles.css): paper #f9f9f9, ink #17203a,
# line #e3e5ea, muted #6e7382, danger #d63c34.
[theme]
base = "light"
primaryColor = "#17203a"
backgroundColor = "#f9f9f9"
secondaryBackgroundColor = "#ffffff"
textColor = "#17203a"
font = "sans serif"

[server]
# Fixed port so it never collides with the user's other local servers.
port = 8506
headless = true
